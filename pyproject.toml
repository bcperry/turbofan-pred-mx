[project]
name = "turbofan-pred-mx"
version = "0.1.0"
description = "NASA C-MAPSS predictive maintenance data workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-ai-ml>=1.35.2",
    "azure-identity>=1.26.0",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
